model = "__MODEL_ID__"
model_provider = "ollama-benchmark"
model_catalog_json = "__MODEL_CATALOG_JSON__"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
web_search = "disabled"

[model_providers.ollama-benchmark]
name = "Ollama local benchmark"
base_url = "http://127.0.0.1:11434/v1/"
wire_api = "responses"

# These bundled skills are unrelated to the coding benchmark and otherwise
# consume a large fraction of a local model's prompt budget.
[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\imagegen"
enabled = false

[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\openai-docs"
enabled = false

[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\plugin-creator"
enabled = false

[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\review-agent"
enabled = false

[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\skill-creator"
enabled = false

[[skills.config]]
path = "__CODEX_HOME__\\skills\\.system\\skill-installer"
enabled = false
