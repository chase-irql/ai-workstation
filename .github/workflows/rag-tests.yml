name: RAG tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            rag/requirements.txt
            rag/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r rag/requirements-dev.txt

      - name: Run RAG tests
        run: python -m pytest rag/tests -q

      - name: Validate dataset registry
        shell: pwsh
        run: .\scripts\validate-dataset-registry.ps1
